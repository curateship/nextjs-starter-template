<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal window mockup</title>
<!-- Standalone terminal-window mockup. The same .term markup is embedded inline
     in ../template.html. Swap the .body lines per project. Keep it generic. -->
<style>
:root{
  --line-2:#2b2e33; --dim:#7f868f; --muted:#c4c9d0; --ink:#eef1f4;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
  --green:#28c840; --accent:#ff7a33;
}
*{box-sizing:border-box}
body{margin:0;background:#0c0d0e;min-height:100vh;display:grid;place-items:center;font-family:var(--sans)}

/* ---- the reusable terminal window ---- */
.term{width:820px;border-radius:12px;overflow:hidden;background:#0b0c0d;
  border:1px solid var(--line-2);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.term .tbar{height:34px;background:#151617;display:flex;align-items:center;gap:8px;padding:0 12px;
  font-family:var(--sans);font-size:12.5px;color:var(--dim);border-bottom:1px solid #000}
.term .tbar .dot{width:12px;height:12px;border-radius:50%;background:#3a3b3e}
.term .tbar .dot.r{background:#ff5f57}.term .tbar .dot.y{background:#febc2e}.term .tbar .dot.g{background:#28c840}
.term .tbar b{margin-left:8px;font-weight:600;color:var(--muted);font-family:var(--mono)}
.term .body{padding:14px 16px 18px;font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--muted);min-height:300px}
.term .body .pr{color:var(--green)}
.term .body .dim{color:var(--dim)}
.term .body .ok{color:var(--green)}
.term .body .cur{display:inline-block;width:8px;height:14px;background:var(--muted);
  vertical-align:-2px;margin-left:2px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
</style>
</head>
<body>
  <div class="term">
    <div class="tbar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <b>~ — zsh</b>
    </div>
    <div class="body">
      <div><span class="pr">~/project %</span> npm run build</div>
      <div class="dim">vite v5 · building for production…</div>
      <div class="ok">✓ 34 modules transformed</div>
      <div class="dim">dist/index.html            1.2 kB</div>
      <div class="dim">dist/assets/index-8f2c.js  86.4 kB │ gzip: 28.1 kB</div>
      <div class="ok">✓ built in 742ms</div>
      <div><span class="pr">~/project %</span> git commit -am "ship it"</div>
      <div class="dim">[main 0773652] 3 files changed, 214 insertions(+)</div>
      <div><span class="pr">~/project %</span> <span class="cur"></span></div>
    </div>
  </div>
</body>
</html>

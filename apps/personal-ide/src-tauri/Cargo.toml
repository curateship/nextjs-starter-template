[package]
name = "personal-ide"
version = "0.1.0"
description = "Desktop IDE Thin MVP"
authors = ["System Everything"]
edition = "2021"

[lib]
name = "personal_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
trash = "5.2.6"

; Neko auto-loads this at boot. Launches the Camoufox window on Neko's X display,
; running as the same unprivileged user Neko uses (ENV_USER), with DISPLAY pointed
; at the framebuffer Neko captures and streams.
;
; Promo's launcher differs from anti-detect's in one way: it also serves the
; command port, so the app can drive the same window a person can watch.
[program:camoufox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",PYTHONPATH="/opt/promo"
command=/opt/camoufox/bin/python /opt/promo/launch.py
user=%(ENV_USER)s
autorestart=true
startretries=3
stdout_logfile=/var/log/neko/camoufox.log
stderr_logfile=/var/log/neko/camoufox.err
priority=800

; Neko auto-loads this at boot. Launches the Camoufox window on Neko's X display,
; running as the same unprivileged user Neko uses (ENV_USER), with DISPLAY pointed
; at the framebuffer Neko captures and streams.
[program:camoufox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/opt/camoufox/bin/python /opt/launch-camoufox.py
user=%(ENV_USER)s
autorestart=true
startretries=3
stdout_logfile=/var/log/neko/camoufox.log
stderr_logfile=/var/log/neko/camoufox.err
priority=800

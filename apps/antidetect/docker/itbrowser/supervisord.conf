; Launches itbrowser (Chromium fork) on Neko's X display.
; NOTE: confirm the real binary path inside the extracted .7z and update `command`.
; --itbrowser=<json> applies the fingerprint; --no-sandbox is required under the
; container's unprivileged user; --user-data-dir gives a persistent profile.
[program:itbrowser]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/opt/itbrowser/chrome --itbrowser=/data/fingerprint.json --user-data-dir=/data/profile --no-first-run --no-default-browser-check --no-sandbox --start-maximized
user=%(ENV_USER)s
autorestart=true
startretries=3
stdout_logfile=/var/log/neko/itbrowser.log
stderr_logfile=/var/log/neko/itbrowser.err
priority=800

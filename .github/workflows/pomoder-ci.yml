name: Pomoder CI

on:
  pull_request:
    paths: ["apps/pomoder/**", "local-apps.json", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/pomoder-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/pomoder/**", "local-apps.json", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/pomoder-ci.yml"]

concurrency:
  group: pomoder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: pomoder
        ports: ["54326:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POMODER_DATABASE_URL: postgresql://postgres:localdev@127.0.0.1:54326/pomoder
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      # Must precede setup-node so that cache: pnpm can find the store.
      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate test database
        run: pnpm --filter pomoder db:migrate
      - name: Lint
        run: pnpm --filter pomoder lint
      - name: Typecheck
        run: pnpm --filter pomoder typecheck
      - name: Unit and integration tests
        run: pnpm --filter pomoder test
      - name: Production build
        run: pnpm --filter pomoder build
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      # playwright is pomoder's devDependency, not the root's. npx found it via
      # npm's hoisting; pnpm needs the filter to resolve the binary.
      - name: Install browser
        run: pnpm --filter pomoder exec playwright install --with-deps chromium
      # No `--` before --project: npm strips it, pnpm forwards it literally.
      - name: Browser tests
        run: pnpm --filter pomoder test:e2e --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pomoder-browser-failure
          path: |
            apps/pomoder/playwright-report
            apps/pomoder/test-results
